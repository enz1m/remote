<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Remote</title>
  <defs>
    <filter id="enz-remote-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- landscape keyline; far screen 72 x 54 (14..86 x 24..78), near screen 74 x 58 (40..114 x 46..104), radius 9,
       6 px frames like the rest of the set; overlap 46 x 32; far screen shows a window, the near one the same window
       with one text line and a pointer (tip 86 70, 0.72 scale) -->
  <g filter="url(#enz-remote-drop)">
    <rect x="14" y="24" width="72" height="54" rx="9" fill="#0C8585"/>
  </g>
  <rect x="20" y="30" width="60" height="42" rx="4" fill="#FFFFFF"/>
  <rect x="27" y="37" width="30" height="18" rx="3" fill="#BCEBEB"/>
  <g filter="url(#enz-remote-drop)">
    <rect x="40" y="46" width="74" height="58" rx="9" fill="#14A3A3"/>
  </g>
  <rect x="46" y="52" width="62" height="46" rx="4" fill="#FFFFFF"/>
  <rect x="53" y="59" width="34" height="20" rx="3" fill="#14A3A3"/>
  <g fill="#B9C3D3">
    <rect x="53" y="84" width="26" height="4" rx="2"/>
  </g>
  <path d="M86 70 L86 91.6 L91 86.9 L95 95.2 L99.3 93.3 L95.4 85.1 L102.2 84.8 Z" fill="#FFFFFF" stroke="#2B3140" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
